name: BackBlaze2Sync
options:
  bundleIdPrefix: mx.smh.backblaze2sync
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  BackBlaze2Sync:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.smh.backblaze2sync.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "4"
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Info.plist
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
      configs:
        Release:
          ONLY_ACTIVE_ARCH: NO
          ARCHS: "$(ARCHS_STANDARD)"
